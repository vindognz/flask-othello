<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlaskOthello</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <a href="/" class="home-link" title="Home">🏠</a>
    <h1>FlaskOthello</h1>

    <div id="opponent-choice">
        <p>Play against:</p>
        <button onclick="chooseOpponent('human')">Human</button>
        <button onclick="chooseOpponent('cpu')">Computer</button>
    </div>

    <div id="colour-choice">
        <div id="difficulty-section" style="display: none;">
            <p>Difficulty:</p>
            <button onclick="setDifficulty(0)">Easy</button>
            <button onclick="setDifficulty(1)">Medium</button>
            <button onclick="setDifficulty(5)">Impossible</button>
        </div>

        <div id="colour-buttons" style="display: none;">
            <p>Play as:</p>
            <button onclick="createGame('black')">Black</button>
            <button onclick="createGame('white')">White</button>
        </div>

        <div id="join-section" style="display: none;">
            <p id="code-error" style="display: none;">Invalid game code.</p>
            <input type="text" id="join-code" placeholder="Enter game code to join">
            <button onclick="joinGame()">Join</button>
        </div>
    </div>

    <script>
        let chosenOpponent = null;
        let chosenDepth = 1; // medium if you somehow start an AI game without selecting a difficulty

        function chooseOpponent(type) {
            chosenOpponent = type;
            document.getElementById("opponent-choice").style.display = "none";

            if (type === 'human') {
                document.getElementById("colour-buttons").style.display = "block";
                document.getElementById("join-section").style.display = "block";
            } else {
                document.getElementById("difficulty-section").style.display = "block";
                // colour-choice stays hidden until a difficulty is picked
            }
        }

        function setDifficulty(depth) {
            chosenDepth = depth;
            document.getElementById("colour-buttons").style.display = "block";
            document.getElementById("difficulty-section").style.display = "none";
        }

        async function createGame(colour) {
            const response = await fetch("/api/game/new", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ host_colour: colour, opponent: chosenOpponent, ai_depth: chosenDepth }),
            });
            const data = await response.json();
            window.location.href = `/game/${data.game_id}`;
        }

        async function joinGame() {
            const code = document.getElementById("join-code").value.trim();
            const game = await fetch(`/api/game/${code}`);

            if (code && game.ok) {
                window.location.href = `/game/${code}`;
            } else {
                document.getElementById("code-error").style.display = "block";
                setTimeout(() => {
                    document.getElementById("code-error").style.display = "none";
                }, 5000);
            }
        }
    </script>

    <script>
        const clickSound = new Audio("/static/sfx/click.mp3");
        clickSound.volume = 0.5;
        document.addEventListener("mousedown", (event) => {
            if (event.target.closest("button")) {
                clickSound.currentTime = 0;
                clickSound.play().catch(() => {});
            }
        });
    </script>
</body>
</html>
